# Gitpod is now OpenAI Ona and new signups are closed.
# Use GitHub Codespaces instead: see .devcontainer/devcontainer.json and DEVENV.md
#
# Open in GitHub Codespaces:
# https://github.com/codespaces/new?hide_repo_select=true&ref=main&repo=heri99123/CyberwatchIDS
#
# This file is kept for backwards compatibility with existing Gitpod accounts.
image: gitpod/workspace-full

tasks:
  - name: Rust backend
    init: |
      # Install Rust toolchain
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      source "$HOME/.cargo/env"

      # Install build dependencies for rusqlite bundled
      sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Build Rust backend (this caches dependencies in Gitpod)
      cd backend && cargo build --release 2>&1 || echo "Build will complete on first run"
    command: |
      source "$HOME/.cargo/env"
      cd backend
      echo "=== CyberWatch IDS Rust Backend ==="
      echo "Starting on port 8421..."
      cargo run --release

  - name: Vue frontend (dev)
    init: |
      # Install Node.js dependencies
      npm install
    command: |
      echo "=== Vue Frontend Dev Server ==="
      echo "Starting Vite dev server on port 5173..."
      npm run dev

vscode:
  extensions:
    - rust-lang.rust-analyzer
    - Vue.volar
    - bradlc.vscode-tailwindcss
    - serayuzgur.crates

ports:
  - port: 8421
    visibility: public
    description: Rust backend API + WebSocket
  - port: 5173
    visibility: public
    description: Vue frontend dev server
    onOpen: open-preview
