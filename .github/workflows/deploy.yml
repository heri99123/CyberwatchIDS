name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: build-rust
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: cyberwatch-ids-binary

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: cyberwatch-ids-frontend
          path: dist/

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/dist deploy/data
          cp cyberwatch-ids deploy/
          cp -r dist/* deploy/dist/
          cp -r data/* deploy/data/ 2>/dev/null || true
          cp deploy.sh deploy/ 2>/dev/null || true
          tar -czf deploy.tar.gz deploy/

      - name: Upload to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Execute deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /tmp
            tar -xzf deploy.tar.gz
            cd deploy
            chmod +x deploy.sh
            ./deploy.sh
            rm -rf /tmp/deploy.tar.gz /tmp/deploy
