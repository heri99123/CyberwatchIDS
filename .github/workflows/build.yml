name: Build CyberWatch IDS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===== RUST BACKEND BUILD =====
  build-rust:
    name: Build Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust backend (release)
        working-directory: backend
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberwatch-ids-binary
          path: backend/target/release/cyberwatch-ids
          retention-days: 30

  # ===== FRONTEND BUILD =====
  build-frontend:
    name: Build Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberwatch-ids-frontend
          path: dist/
          retention-days: 30

  # ===== DOCKER BUILD (optional, for containerized deploy) =====
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-rust, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download built frontend (dist/)
        uses: actions/download-artifact@v4
        with:
          name: cyberwatch-ids-frontend
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cyberwatch-ids:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/cyberwatch-ids.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberwatch-ids-docker
          path: /tmp/cyberwatch-ids.tar
          retention-days: 7
