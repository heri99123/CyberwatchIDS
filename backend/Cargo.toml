[package]
name = "cyberwatch-ids"
version = "3.0.0"
edition = "2021"
description = "CyberWatch IDS - Rust backend for multi-tenant SaaS intrusion detection"
license = "AGPL-3.0-only"
authors = ["Heri Muhrial <heri99123@users.noreply.github.com>"]
repository = "https://github.com/heri99123/CyberwatchIDS"
readme = "../README.md"
keywords = ["ids", "security", "intrusion-detection", "cybersecurity", "siem"]
categories = ["security", "web-programming::http-server"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"

# Regex for IDS pattern matching
regex = "1.11"

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Rate limiting (Task #25)
# NOTE: the crates.io package is literally named `tower_governor` (underscore).
# The sparse index does not normalise hyphen <-> underscore, so `tower-governor`
# fails with "no matching package named ...". Rust imports use the same spelling.
tower_governor = { version = "0.5", features = ["axum", "tracing"] }

# Email notifications (Task #27) — async SMTP over rustls 0.21/`ring`.
# default-features = false avoids native-tls/OpenSSL. `tokio1-rustls-tls`
# already pulls in `rustls-tls` + `tokio1`, so no aws-lc-rs/cmake is needed.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1-rustls-tls",
    "tracing",
] }

# Report export (Task #31)
csv = "1.3"

# NOTE: native HTTPS termination (axum-server + rustls-pemfile) is deferred to
# Task #42. TLS is currently terminated by the reverse proxy in front of the app.

# Utilities
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
